# Production web ingress is loopback-only behind Caddy, which replaces client
# X-Forwarded-Proto. Preserve that protocol; absent/invalid values use this hop.
map $http_x_forwarded_proto $rewind_forwarded_proto {
    default $scheme;
    ~^http$ http;
    ~^https$ https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser-facing defaults for the static app. Keep the CSP compatible with
    # the Font Awesome stylesheet currently used by the UI and remote movie art.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $rewind_forwarded_proto;
        # Spring prioritizes RFC Forwarded, which Caddy does not replace.
        proxy_set_header Forwarded "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
