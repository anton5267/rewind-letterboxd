spring:
  cache:
    type: ${SPRING_CACHE_TYPE:none}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rewind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:rewind}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

server:
  error:
    include-message: always
    include-binding-errors: always

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # Local Vite origins. Production Compose overrides this with an explicit
    # comma-separated allowlist; empty means same-origin web/API traffic only.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  newsletter:
    delivery-interval-ms: ${NEWSLETTER_DELIVERY_INTERVAL_MS:30000}
    delivery-batch-size: ${NEWSLETTER_DELIVERY_BATCH_SIZE:50}
    max-attempts: ${NEWSLETTER_MAX_ATTEMPTS:5}
    retry-delay-seconds: ${NEWSLETTER_RETRY_DELAY_SECONDS:300}
  tmdb:
    enabled: ${TMDB_ENABLED:false}
    api-key: ${TMDB_API_KEY:}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    scheduler:
      enabled: ${TMDB_SCHEDULER_ENABLED:false}
      batch-size: ${TMDB_SCHEDULER_BATCH_SIZE:10}
      interval-ms: ${TMDB_SCHEDULER_INTERVAL_MS:86400000}
      initial-delay-ms: ${TMDB_SCHEDULER_INITIAL_DELAY_MS:60000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
  auth:
    refresh-days: 30
    cookie-secure: ${COOKIE_SECURE:true}
  security:
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:60}
    reset-password:
      token-ttl-minutes: 30
      frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:3000/uk/reset-password}
      token-pepper: ${RESET_TOKEN_PEPPER:}
      from: ${MAIL_FROM:no-reply@rewind.local}
