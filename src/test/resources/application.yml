spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rewind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:rewind}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

server:
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: test-only-signing-key-with-at-least-thirty-two-bytes
    expiration-minutes: 120
  security:
    reset-password:
      token-ttl-minutes: 30
      frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:3000/reset-password}
      token-pepper: ${RESET_TOKEN_PEPPER:}
      from: ${MAIL_FROM:no-reply@rewind.local}
