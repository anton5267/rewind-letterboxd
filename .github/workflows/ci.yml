name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supabase-migration-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Start isolated Supabase stack
        run: supabase start --exclude studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Replay all migrations from a clean baseline
        run: supabase db reset --no-seed
      - name: Verify cached Edge policy settings
        run: supabase db query --file scripts/verify-rls-initplan.sql
      - name: Verify Edge policy consolidation
        run: supabase db query --file scripts/verify-rls-policy-consolidation.sql
      - name: Verify migration history and PostgreSQL runtime
        run: |
          supabase migration list
          supabase db query --read-only "select version() as server_version"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rewind
          MYSQL_USER: rewind
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://localhost:3306/rewind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: rewind
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-signing-key-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests with MySQL
        working-directory: backend
        run: sh ./mvnw -B test
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Verify Cloudflare Pages canonical build configuration
        run: |
          node --check frontend/scripts/build-cloudflare-pages.mjs
          node --test frontend/scripts/cloudflare-pages-build-config.test.mjs
      - name: Verify Supabase Edge API
        working-directory: supabase/functions/rewind-api
        run: |
          deno check index.ts
          deno test
      - name: Verify curated TMDB crosswalk structure
        working-directory: frontend
        run: npm run verify:tmdb-crosswalk
      - name: Frontend build and type check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Validate HTTPS proxy configuration
        run: |
          docker run --rm \
            -v "$PWD/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
