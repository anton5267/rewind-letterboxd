name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rewind
          MYSQL_USER: rewind
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://localhost:3306/rewind?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: rewind
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-signing-key-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests with MySQL
        run: ./mvnw -B test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: letterboxd/letterboxd-login-figma-final2/package-lock.json
      - name: Frontend build and type check
        working-directory: letterboxd/letterboxd-login-figma-final2
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Validate HTTPS proxy configuration
        run: |
          docker run --rm \
            -v "$PWD/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
