name: Encrypted Supabase application backup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run a fresh encrypted backup or restore an existing encrypted artifact into a disposable PostgreSQL database
        type: choice
        required: true
        default: backup
        options:
          - backup
          - restore
      restore_run_id:
        description: Source workflow run ID for the encrypted artifact (required for restore)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: inputs.operation == 'backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Export and encrypt application schema
        shell: bash
        env:
          PGHOST: ${{ secrets.SUPABASE_BACKUP_HOST }}
          PGUSER: ${{ secrets.SUPABASE_BACKUP_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.REWIND_BACKUP_PASSPHRASE }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          umask 077
          for name in PGHOST PGUSER PGPASSWORD BACKUP_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required backup setting $name"
              exit 1
            fi
          done
          work="$RUNNER_TEMP/rewind-backup"
          mkdir -p "$work"
          trap 'rm -f "$work/rewind.dump"' EXIT
          docker run --rm \
            -e PGHOST -e PGUSER -e PGPASSWORD -e PGPORT -e PGDATABASE \
            -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            postgres:17 pg_dump --format=custom --schema=rewind --no-owner --no-acl \
            > "$work/rewind.dump"
          test -s "$work/rewind.dump"
          docker run --rm -i postgres:17 pg_restore --list \
            < "$work/rewind.dump" > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 --symmetric \
            --cipher-algo AES256 --output "$work/rewind.dump.gpg" "$work/rewind.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet \
            --pinentry-mode loopback --passphrase-fd 0 --decrypt "$work/rewind.dump.gpg" \
            | cmp --silent "$work/rewind.dump" -
          cd "$work"
          sha256sum rewind.dump.gpg > rewind.dump.gpg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rewind-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rewind-backup/rewind.dump.gpg
            ${{ runner.temp }}/rewind-backup/rewind.dump.gpg.sha256
          retention-days: 30
          if-no-files-found: error

  restore:
    if: inputs.operation == 'restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rewind_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rewind-restore-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rewind_restore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate restore run ID
        shell: bash
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          if [[ ! "$RESTORE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Choose restore and provide the numeric run ID of a non-expired encrypted backup."
            exit 2
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.restore_run_id }}
          name: rewind-encrypted-backup-${{ inputs.restore_run_id }}
          path: ${{ runner.temp }}/rewind-backup-artifact
      - name: Restore verified archive into disposable PostgreSQL
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.REWIND_BACKUP_PASSPHRASE }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: rewind_restore
          PGUSER: postgres
          PGPASSWORD: rewind-restore-only
          PGSSLMODE: disable
        run: bash scripts/restore-supabase-backup.sh "$RUNNER_TEMP/rewind-backup-artifact"
