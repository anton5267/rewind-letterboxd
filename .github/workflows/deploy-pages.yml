name: Deploy REWIND to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build full application for GitHub Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /rewind-letterboxd/
          VITE_API_BASE_URL: https://cuirmicbzspomijgkkwo.supabase.co/functions/v1/rewind-api/api
          VITE_SUPABASE_URL: https://cuirmicbzspomijgkkwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_AUTH_ENABLED: "true"
          VITE_PUBLIC_CATALOG_ONLY: "false"
        run: npm run verify:build
      - name: Generate static catalogue route pages
        working-directory: frontend
        env:
          PUBLIC_CATALOG_API_BASE_URL: https://cuirmicbzspomijgkkwo.supabase.co/functions/v1/rewind-api/api
          PUBLIC_SITE_URL: https://anton5267.github.io/rewind-letterboxd/
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/prerender-public-catalog-routes.mjs
      - name: Verify localized root route shells
        working-directory: frontend
        run: node scripts/verify-language-root-routes.mjs
      - name: Configure SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
