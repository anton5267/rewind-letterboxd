services:
  db:
    image: public.ecr.aws/docker/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rewind}
      MYSQL_USER: ${DB_USERNAME:-rewind}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - rewind-production-db:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rewind-production-redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-rewind}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-rewind}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      COOKIE_SECURE: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      SPRING_CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379
      REDIS_HEALTH_ENABLED: "true"
      MAIL_HEALTH_ENABLED: "true"
      FRONTEND_RESET_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}/uk/reset-password
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env.production}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env.production}
      TMDB_ENABLED: ${TMDB_ENABLED:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_SCHEDULER_ENABLED: ${TMDB_SCHEDULER_ENABLED:-false}
      TMDB_SCHEDULER_BATCH_SIZE: ${TMDB_SCHEDULER_BATCH_SIZE:-10}
      TMDB_SCHEDULER_INTERVAL_MS: ${TMDB_SCHEDULER_INTERVAL_MS:-86400000}
      TMDB_SCHEDULER_INITIAL_DELAY_MS: ${TMDB_SCHEDULER_INITIAL_DELAY_MS:-60000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-127.0.0.1:8088}:80"

volumes:
  rewind-production-db:
  rewind-production-redis:
