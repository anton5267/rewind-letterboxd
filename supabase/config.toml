# Auth templates are the version-controlled source of truth. Apply the same
# subject/body in the hosted project's Authentication → Emails dashboard.
[auth.email.template.confirmation]
subject = "{{ if eq .Data.language \"en\" }}Confirm your REWIND email{{ else }}Підтвердьте пошту REWIND{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ $uk := eq .RedirectTo (printf \"%suk/reset-password/\" .SiteURL) }}{{ if or (eq .RedirectTo (printf \"%sen/reset-password/\" .SiteURL)) (and (not $uk) (eq .Data.language \"en\")) }}Reset your REWIND password{{ else }}Відновіть пароль REWIND{{ end }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "{{ $uk := eq .RedirectTo (printf \"%suk/login/\" .SiteURL) }}{{ if or (eq .RedirectTo (printf \"%sen/login/\" .SiteURL)) (and (not $uk) (eq .Data.language \"en\")) }}Confirm REWIND email change{{ else }}Підтвердьте зміну пошти{{ end }}"
content_path = "./supabase/templates/email-change.html"

# The router handles public and protected application routes. Protected routes
# enforce authentication and authorization inside the Edge handler.
[functions.rewind-api]
verify_jwt = false
